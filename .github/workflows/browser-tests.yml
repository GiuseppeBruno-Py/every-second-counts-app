name: Browser tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run canonical suite
        if: github.event_name != 'workflow_dispatch'
        run: npm run test:all
      - name: Render Linux snapshots for review
        if: github.event_name == 'workflow_dispatch'
        run: npm run build:test && npx playwright test tests/browser/design-system-flows.spec.js --project=chromium --grep "snapshots responsivos" --update-snapshots=all
      - name: Upload Playwright evidence
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            test-results
            tests/browser/design-system-flows.spec.js-snapshots/*-chromium-linux.png
          retention-days: 7
