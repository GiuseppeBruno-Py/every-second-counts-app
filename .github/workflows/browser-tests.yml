name: Browser tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build:test && npx playwright test tests/browser/design-system-flows.spec.js --project=chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: test-results
